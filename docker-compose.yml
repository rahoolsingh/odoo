version: '3.8'

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: veer
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: odoo20
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veer -d odoo20"]
      interval: 10s
      timeout: 5s
      retries: 5

  odoo:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8069:8069"
    environment:
      ADMIN_PASSWORD: admin
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: veer
      DB_PASSWORD: admin
      DB_NAME: odoo20
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      odoo-bin
        --db_host=postgres
        --db_port=5432
        --db_user=veer
        --db_password=admin
        --database=odoo20
        --load=base,hr,crm
        --without-demo=all
        --no-xmlrpc

volumes:
  pgdata:
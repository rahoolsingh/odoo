version: "1"
services:
  - type: postgresql
    name: odoo-postgres
    plan: free
    region: oregon
    databaseName: odoo20
    user: veer
    postgresMajorVersion: "16"
  - type: web
    name: odoo-web
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: ADMIN_PASSWORD
        value: admin
      - key: DB_HOST
        fromService:
          type: postgresql
          name: odoo-postgres
          property: host
      - key: DB_PORT
        value: "5432"
      - key: DB_USER
        fromService:
          type: postgresql
          name: odoo-postgres
          property: user
      - key: DB_PASSWORD
        fromService:
          type: postgresql
          name: odoo-postgres
          property: password
      - key: DB_NAME
        fromService:
          type: postgresql
          name: odoo-postgres
          property: databaseName
      - key: HTTP_PORT
        value: "8069"
    buildCommand: ""
    startCommand: odoo-bin -d odoo20 --db_host=$DB_HOST --db_port=$DB_PORT --db_user=$DB_USER --db_password=$DB_PASSWORD --load=base,hr,crm --without-demo=all
services:
  - type: web
    name: odoo-web
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: ADMIN_PASSWORD
        value: admin
      - key: DB_HOST
        value: odoo-postgres
      - key: DB_PORT
        value: "5432"
      - key: DB_USER
        value: veer
      - key: DB_PASSWORD
        value: admin
      - key: DB_NAME
        value: odoo20

databases:
  - name: odoo-postgres
    databaseName: odoo20
    user: veer
    plan: free
    region: oregon
    postgresMajorVersion: "16"
version: "1"
services:
  - type: web
    name: odoo-web
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: ADMIN_PASSWORD
        value: admin
      - key: DB_HOST
        fromDatabase:
          name: odoo-postgres
          property: host
      - key: DB_PORT
        value: "5432"
      - key: DB_USER
        fromDatabase:
          name: odoo-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: odoo-postgres
          property: password
      - key: DB_NAME
        value: odoo20
    buildCommand: ""
    startCommand: odoo-bin -d odoo20 --db_host=$DB_HOST --db_port=$DB_PORT --db_user=$DB_USER --db_password=$DB_PASSWORD --load=base,hr,crm --without-demo=all
databases:
  - name: odoo-postgres
    databaseName: odoo20
    user: veer
    plan: free
    region: oregon
    majorVersion: 16
